est mast","built around a mooring tower taller than any cathedral","whose docks hang from the clifftop on iron chains","where passengers board by basket, lift or very long ladder","whose customs men fly patrol kites over the harbour","where every inn has a balcony for parking airships","famous for its airship races and its fearless riggers","whose skyline is crowded with gondolas and gasbags","where the post office has its own fleet of dirigibles","whose clock tower doubles as a mooring mast at noon","where ropes, pulleys and winches hum day and night","built on a plateau where the winds always blow favourably","whose sail-lofts stitch envelopes from the finest silk","where captains swap tall tales over strong tea and crumpets","whose lighthouse shines upwards for ships in the clouds","where the cobbles are worn smooth by mooring cables","famous for its balloon-makers and its windy afternoons","whose guild of riggers is older than the city itself","where the gentry arrive by private airship every summer","that holds a grand air fair every midsummer"],"clockwork":["where the streets rearrange themselves every hour on the hour","built inside the workings of an enormous clock","whose bridges rise and fall to the tick of a great pendulum","where every citizen carries a key to wind the city up","whose towers turn slowly to follow the sun","where the trams run on springs and never quite stop","whose great clock has not lost a second in two hundred years","where the guild of watchmakers rules from a glass tower","built on a giant turntable that makes one turn a day","whose fountains are powered by falling weights","where the bells play a different tune every quarter hour","whose automaton guards wear bowler hats and polished brass","where the moon is tracked by an orrery the size of a cathedral","that must be wound by hand once a year at midsummer","where every doorway clicks open with a tiny brass key","whose market stalls fold away into the walls at dusk","where the whole city stops for one silent minute at noon","whose gears can be heard humming beneath the pavements","built by a clockmaker who wanted to measure eternity","where time runs slightly faster on the east side","whose streetlamps light one after another like the hand of a clock","where the cogwheel mill grinds flour, pepper and time","whose clockwork birds sing the hours from every rooftop","where children set their watches by the great bell, Old Tom","famous for its musical clocks and its mechanical gardens"],"smog":["where the fog is so thick that the lamps burn all day","built in the old sewers beneath a grander city","whose people have not seen a clear sky in three generations","where gas lamps light tunnels that go on for miles","whose market is held in a flooded railway cutting","where the smog is sold in jars to curious tourists","reached by a steam lift that creaks all the way down","whose rooftops are the cellars of the city above","where the chimney sweeps run the town council","whose canals run through tunnels lit by glow-lanterns","where everyone wears goggles and a scarf all year round","built in a flooded coal mine pumped dry by great engines","whose fog horns sound every hour to warn the boats","where the pipes hiss, clank and groan all night","whose lamp-makers are the richest folk in town","where the trains run beneath the streets in clouds of steam","built in the brick arches under an old railway viaduct","whose sky is the underside of a great iron bridge","where the only sunlight arrives through a single grating","whose mushroom farms feed the whole city above","where the smoke from a thousand chimneys gathers in the hollow","whose tunnels are marked with chalk arrows and hope","where the rain comes down black and the cats come out grey","whose underground river carries coal barges to the sea","known for its fogbound alleys and friendly lamplit pubs"],"frontier":["a railhead town at the very end of the line","built around a telegraph post on the edge
