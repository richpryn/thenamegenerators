                <div class="gen-grid">

                <option value="title">With a title (Archmage Ottilie)</option>
              </select>
            </div>
          </div>

          <div class="group">
            <label class="label" for="filter-school">School of Magic</label>
            <div class="ctl sel hd">

                <option value="illusion">Illusion</option>
                <option value="necromancy">Necromancy</option>
                <option value="transmutation">Transmutation (change)</option>

            </div>
          </div>

            <label class="label" for="filter-letter">Starts with</label>

              <select id="filter-letter" name="letter" data-filter="letter">

                <option value="t">T</option>
                <option value="w">W</option>

            </div>
          </div></div>
