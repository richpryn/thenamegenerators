 castle and now holds only crows","where the locals leave a coin on the jetty before they sail","whose water is warm in winter and cold as ice in summer","where a drowned choir can be heard on still nights","that has no streams flowing in and none flowing out","where the dead are said to rise to watch the full moon","whose shore is lined with standing stones that lean towards the water","where every clock in the boathouse stopped at the same minute"],"crystal":["so clear you can see the crystals growing on the bottom","that glows soft blue on moonless nights","where fallen stars are said to rest on the lake bed","whose water rings like a bell when you drop a pebble in","that shows you a glimpse of the future on midsummer morning","where unicorns come to drink at dawn","that never freezes and never quite reflects the real sky","whose shore is made of tiny, shining gemstones","where the fish are made of living glass","that grants a wish to anyone who drops in a silver coin","where fairies skate on the surface without breaking it","whose islands drift slowly round the lake each year","where the mist sparkles like powdered diamonds","that sings softly in the early morning","whose water turns every colour of the rainbow at sunset","where the wizards of old came to read the stars in its reflection","that holds the reflection of the moon long after it sets","where lost things wash up on the shore, a year to the day later","whose ice is so clear that skaters seem to float on air","where glow-worms light the paths around the shore","that heals the wounds of anyone who bathes at midnight","where silver swans nest on floating lily pads","whose depths are lit by a light no diver has ever reached","where a sleeping dragon of pure crystal lies beneath the surface","that is said to be a mirror into the fairy realm","where snowflakes turn to tiny stars before they touch the water"]}},"capitalise":true}</script>
