        <section class="sheet hd simple-generator" id="generator" aria-label="Middle Name Generator">
                <div class="gen-grid">
          <div class="group" role="group" aria-labelledby="filter-gender-label">
            <div class="label"><span id="filter-gender-label">For a</span><span class="pen" data-hint-for="gender" aria-hidden="true"></span></div>
            <div class="opts" data-buttons-for="gender">
              <button type="button" class="opt hd tap" data-value="any" data-hint="" aria-pressed="true">Girl or boy</button>
              <button type="button" class="opt hd tap" data-value="girl" data-hint="" aria-pressed="false">Girl</button>
              <button type="button" class="opt hd tap" data-value="boy" data-hint="" aria-pressed="false">Boy</button>
            </div>
            <input type="hidden" id="filter-gender" name="gender" data-filter="gender" value="any">
          </div>

          <div class="group">
            <label class="label" for="filter-style">Style</label>
            <div class="ctl sel hd">
              <select id="filter-style" name="style" data-filter="style">
                <option value="any">Any style</option>
                <option value="popular">Popular now (Rose)</option>
                <option value="classic">20th century (Elizabeth)</option>
                <option value="short">Short (Mae)</option>
                <option value="long">Long and flowing (Penelope)</option>
                <option value="unusual">Less common (Marigold)</option>
              </select>
            </div>
          </div>

          <div class="group" role="group" aria-labelledby="filter-count-label">
            <div class="label"><span id="filter-count-label">How many</span><span class="pen" data-hint-for="count" aria-hidden="true"></span></div>
            <div class="opts" data-buttons-for="count">
              <button type="button" class="opt hd tap" data-value="one" data-hint="" aria-pressed="true">One middle name</button>
              <button type="button" class="opt hd tap" data-value="two" data-hint="" aria-pressed="false">Two middle names</button>

            <input type="hidden" id="filter-count" name="count" data-filter="count" value="one">
          </div>

          <div class="group">
            <label class="label" for="filter-first">First name</label>
            <div class="ctl hd"><input type="text" id="filter-first" name="first" data-filter="first" placeholder="e.g. Olivia" class="name-input" autocomplete="off"></div>
          </div>

          <div class="group">

          </div></div>
